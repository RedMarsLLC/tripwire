name: Platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test
      - run: python3 Tests/HelperTests/test_session_helper.py
      - run: sh scripts/build-app.sh
      - run: python3 scripts/terminal-smoke.py dist/tripwire
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2.3-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y libsqlite3-dev libssl-dev python3-venv libglib2.0-0t64 libgl1 libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
      - run: swift test
      - run: sh scripts/build-linux.sh
      - run: python3 scripts/terminal-smoke.py dist/linux/tripwire
      - run: python3 -m venv .venv && .venv/bin/pip install -r desktop/requirements.txt
      - run: xvfb-run -a .venv/bin/python Tests/DesktopTests/test_desktop.py
        env:
          QT_QPA_PLATFORM: xcb
          TRIPWIRE_TEST_CLI: .build/debug/tripwire
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: SwiftyLab/setup-swift@57204b19292d4553820e83e5677d305e3ece1a10
        with:
          swift-version: '6.2.3'
          check-latest: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: SQLite development library
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
          "TRIPWIRE_SQLITE_ROOT=$root" >> $env:GITHUB_ENV
          (Join-Path $root 'bin') >> $env:GITHUB_PATH
      - name: Build and test Windows adapters
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Test
      - run: python -m pip install -r desktop/requirements.txt
      - run: python Tests/DesktopTests/test_desktop.py
        env:
          QT_QPA_PLATFORM: offscreen
          TRIPWIRE_TEST_CLI: .build/debug/tripwire.exe
# No live host inventory or evidence-store artifacts are uploaded.
# These checks do not install services, drivers, hooks or privileged providers.
